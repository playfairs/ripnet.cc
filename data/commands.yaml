    description: Run an authorized vulnerability scan.
    usage: ripnet vuln-scan TARGET --port N
    flags: [--port, --timeout, --verbose]
    status: platform
  - name: xmas-scan
    category: scanning
    description: Run an XMAS-style scan.
    usage: ripnet xmas-scan TARGET --start-port N --end-port N
